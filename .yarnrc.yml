# TypeScript 7's `tsc` is a launcher for a platform-native binary, which does its
# own module resolution and cannot read Yarn's PnP manifest — under the default
# linker it fails to resolve `types: ["node", "vite/client"]`. The node-modules
# linker keeps the rest of Berry (lockfile, protocols, workspaces, constraints)
# without pinning us to the last PnP-compatible TypeScript.
#
# Revisit if the native compiler gains PnP support, or if TypeScript is pinned
# back to 5.x — PnP works with everything else here.
nodeLinker: node-modules

# Yarn will not install a version published less than npmMinimalAgeGate minutes ago (a day, by
# default), which is a sound guard against a compromised publish but stops this project taking a
# release of its own planner on the day it is cut. These are first-party — planarnetwork publishes
# the planner and the loader it now reads feeds with — so they are exempt by name rather than the
# gate being lowered for everything.
npmPreapprovedPackages:
  - raptor-journey-planner
  - "@gb-transit/*"
